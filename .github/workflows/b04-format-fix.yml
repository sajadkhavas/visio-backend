name: B04 Ruff Format Fix

on:
  push:
    branches:
      - "phase/visio-b04-cart-wishlist-persistence"

permissions:
  contents: write

concurrency:
  group: b04-format-fix
  cancel-in-progress: false

jobs:
  format:
    name: Apply locked Ruff formatting once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: phase/visio-b04-cart-wishlist-persistence
          persist-credentials: true

      - name: Stop when already formatted marker exists
        id: existing
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[b04-ruff-formatted\]'; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up exact Python
        if: steps.existing.outputs.done == 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install exact Ruff
        if: steps.existing.outputs.done == 'false'
        run: python -m pip install --disable-pip-version-check "ruff==0.16.5"

      - name: Apply project formatter
        if: steps.existing.outputs.done == 'false'
        run: ruff format apps/cart tests/test_b04_cart_wishlist.py

      - name: Commit formatter output
        if: steps.existing.outputs.done == 'false'
        run: |
          set -Eeuo pipefail
          git config user.name "sajadkhavas"
          git config user.email "144109918+sajadkhavas@users.noreply.github.com"
          git add apps/cart tests/test_b04_cart_wishlist.py
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "B04: apply locked Ruff formatting [b04-ruff-formatted]"
          git push origin HEAD:phase/visio-b04-cart-wishlist-persistence
