name: B00 One-Shot Migration Formatter

on:
  push:
    branches:
      - "phase/visio-b00-python-backend-foundation"
    paths:
      - ".github/workflows/b00-format-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format generated Django migration once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.5"

      - name: Format generated migration
        run: |
          set -Eeuo pipefail
          ruff format apps/accounts/migrations/0001_initial.py
          ruff format --check apps/accounts/migrations/0001_initial.py

      - name: Commit formatted migration
        run: |
          set -Eeuo pipefail
          git add apps/accounts/migrations/0001_initial.py
          if git diff --cached --quiet; then
            echo "Migration already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(b00): format generated accounts migration"
          git push origin HEAD:phase/visio-b00-python-backend-foundation
