name: B03 Focused Diagnostic

on:
  push:
    branches:
      - phase/visio-b03-pricing-inventory-integrity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b03-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: visio_ci
          POSTGRES_USER: visio_ci
          POSTGRES_PASSWORD: visio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visio_ci -d visio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_ci
      POSTGRES_USER: visio_ci
      POSTGRES_PASSWORD: visio_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"

      - name: Frozen install
        run: |
          set -Eeuo pipefail
          uv lock --check
          uv sync --frozen --all-groups

      - name: Migrate
        run: uv run python manage.py migrate --noinput

      - name: Focused B03 tests
        run: uv run pytest -x -vv --tb=short tests/test_b03_pricing_inventory.py
