name: B09 Temporary Migration Generator

on:
  push:
    branches:
      - phase/visio-b09-admin-notifications-audit
    paths:
      - .github/workflows/b09-migration-generator.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_ci
      POSTGRES_USER: visio_ci
      POSTGRES_PASSWORD: visio_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Frozen install
        run: uv sync --frozen --all-groups
      - name: Generate operations migration with Django 5.2.17
        run: uv run python manage.py makemigrations operations --noinput
      - name: Commit generated migration only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/operations/migrations
          if git diff --cached --quiet; then
            echo 'NO_MIGRATION_CHANGES'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'B09: add Django 5.2.17 generated operations migration'
          git push origin HEAD:phase/visio-b09-admin-notifications-audit
