name: B06 Ruff Format Preview

on:
  push:
    branches:
      - "phase/visio-b06-orders-lifecycle"
    paths:
      - ".github/workflows/b06-ruff-preview.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.5"
      - name: Format B06 files and print exact output
        run: |
          set -Eeuo pipefail
          ruff format apps/orders/migrations/0001_initial.py apps/orders/selectors.py apps/orders/services.py tests/test_b06_orders.py
          for f in apps/orders/migrations/0001_initial.py apps/orders/selectors.py apps/orders/services.py tests/test_b06_orders.py; do
            echo "===B06_FORMAT_BEGIN:$f==="
            cat "$f"
            echo "===B06_FORMAT_END:$f==="
          done
