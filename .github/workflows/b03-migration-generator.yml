name: B03 Migration Generator

on:
  push:
    branches:
      - phase/visio-b03-pricing-inventory-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_ci
      POSTGRES_USER: visio_ci
      POSTGRES_PASSWORD: visio_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: phase/visio-b03-pricing-inventory-integrity
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"

      - name: Frozen install
        run: |
          set -Eeuo pipefail
          uv lock --check
          uv sync --frozen --all-groups

      - name: Generate Django commerce migration
        run: |
          set -Eeuo pipefail
          uv run python manage.py makemigrations commerce
          uv run ruff format apps/commerce/migrations
          uv run ruff check --fix apps/commerce/migrations
          uv run ruff check apps/commerce/migrations

      - name: Commit generated migration when needed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- apps/commerce/migrations && [ -z "$(git ls-files --others --exclude-standard apps/commerce/migrations)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "sajadkhavas"
          git config user.email "144109918+sajadkhavas@users.noreply.github.com"
          git add apps/commerce/migrations
          git commit -m "db(b03): generate commerce initial migration"
          git push origin HEAD:phase/visio-b03-pricing-inventory-integrity
