name: B08 Generate Django Migration

on:
  push:
    branches:
      - phase/visio-b08-content-search-public-data

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install pinned uv bootstrap tool
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"

      - name: Install frozen dependencies
        run: uv sync --frozen --all-groups

      - name: Generate migration with accepted Django runtime
        run: |
          set -Eeuo pipefail
          uv run python manage.py makemigrations content --noinput
          uv run ruff format apps/content/migrations
          uv run ruff check apps/content/migrations --fix

      - name: Commit generated migration only
        run: |
          set -Eeuo pipefail
          if [[ -z "$(git status --porcelain -- apps/content/migrations)" ]]; then
            echo "No migration delta generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/content/migrations
          git commit -m "B08: generate Django content migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
