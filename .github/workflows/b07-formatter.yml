name: B07 Temporary Ruff Formatter

on:
  push:
    branches:
      - phase/visio-b07-payment-reconciliation
    paths:
      - .github/workflows/b07-formatter.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Frozen install
        run: uv sync --frozen --all-groups
      - name: Apply mechanical Ruff formatting
        run: >-
          uv run ruff format
          apps/payments/migrations/0001_initial.py
          apps/payments/providers/zarinpal.py
          apps/payments/services.py
          tests/test_b07_payments.py
      - name: Emit formatted files
        run: |
          for f in \
            apps/payments/migrations/0001_initial.py \
            apps/payments/providers/zarinpal.py \
            apps/payments/services.py \
            tests/test_b07_payments.py
          do
            echo "===== B07_FORMATTED_BEGIN:${f} ====="
            base64 -w0 "$f"
            echo
            echo "===== B07_FORMATTED_END:${f} ====="
          done
