name: B07 Temporary Ruff Formatter

on:
  push:
    branches:
      - phase/visio-b07-payment-reconciliation
    paths:
      - .github/workflows/b07-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Frozen install
        run: uv sync --frozen --all-groups
      - name: Apply mechanical Ruff formatting
        run: >-
          uv run ruff format
          apps/payments/migrations/0001_initial.py
          apps/payments/providers/zarinpal.py
          apps/payments/services.py
          tests/test_b07_payments.py
      - name: Commit only mechanical formatter output
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/payments/migrations/0001_initial.py \
            apps/payments/providers/zarinpal.py \
            apps/payments/services.py \
            tests/test_b07_payments.py
          if git diff --cached --quiet; then
            echo 'NO_FORMAT_CHANGES'
            exit 0
          fi
          git commit -m 'B07: apply mechanical Ruff formatting'
          git push origin HEAD:phase/visio-b07-payment-reconciliation
