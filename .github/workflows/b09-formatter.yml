name: B09 Temporary Ruff Formatter

on:
  push:
    branches:
      - phase/visio-b09-admin-notifications-audit
    paths:
      - .github/workflows/b09-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Fast-forward to current phase head only
        run: |
          set -Eeuo pipefail
          git fetch origin phase/visio-b09-admin-notifications-audit
          git merge --ff-only origin/phase/visio-b09-admin-notifications-audit
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Frozen install
        run: uv sync --frozen --all-groups
      - name: Apply mechanical Ruff formatting only
        run: |
          uv run ruff format \
            apps/operations/admin.py \
            apps/operations/migrations/0001_initial.py \
            apps/operations/models.py \
            apps/operations/notifications.py \
            apps/operations/roles.py \
            apps/operations/staff_services.py \
            apps/orders/admin.py \
            apps/payments/admin.py \
            config/settings/production.py \
            tests/test_b09_operations.py
      - name: Commit formatter output only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/operations/admin.py \
            apps/operations/migrations/0001_initial.py \
            apps/operations/models.py \
            apps/operations/notifications.py \
            apps/operations/roles.py \
            apps/operations/staff_services.py \
            apps/orders/admin.py \
            apps/payments/admin.py \
            config/settings/production.py \
            tests/test_b09_operations.py
          if git diff --cached --quiet; then
            echo 'NO_FORMAT_CHANGES'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'B09: apply mechanical Ruff formatting'
          git push origin HEAD:phase/visio-b09-admin-notifications-audit
