name: B07 Temporary Hardening Generator

on:
  push:
    branches:
      - phase/visio-b07-payment-reconciliation
    paths:
      - .github/workflows/b07-hardening-generator.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: visio_ci
          POSTGRES_USER: visio_ci
          POSTGRES_PASSWORD: visio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visio_ci -d visio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_ci
      POSTGRES_USER: visio_ci
      POSTGRES_PASSWORD: visio_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Frozen install
        run: uv sync --frozen --all-groups
      - name: Apply hardening patch script
        run: uv run python scripts/b07_hardening_patch.py
      - name: Generate migration
        run: uv run python manage.py makemigrations payments --noinput
      - name: Format and validate
        run: |
          uv run ruff format apps/payments
          uv run ruff check --fix apps/payments
          uv run ruff format apps/payments
          uv run python manage.py makemigrations --check --dry-run
          uv run mypy apps/payments
      - name: Commit hardening
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/payments
          git diff --cached --check
          git commit -m 'B07: harden payment concurrency and financial truth'
          git push origin HEAD:phase/visio-b07-payment-reconciliation
