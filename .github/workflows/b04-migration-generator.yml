name: B04 Django Migration Generator

on:
  push:
    branches:
      - "phase/visio-b04-cart-wishlist-persistence"

permissions:
  contents: write

concurrency:
  group: b04-migration-generator
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Django-owned B04 migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio
      POSTGRES_USER: visio
      POSTGRES_PASSWORD: visio
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: phase/visio-b04-cart-wishlist-persistence
          persist-credentials: true

      - name: Stop when migration already exists
        id: existing
        shell: bash
        run: |
          if [[ -f apps/cart/migrations/0001_initial.py ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up exact Python
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install pinned uv
        if: steps.existing.outputs.exists == 'false'
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"

      - name: Frozen dependency install
        if: steps.existing.outputs.exists == 'false'
        run: uv sync --frozen --all-groups

      - name: Generate migration with Django
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -Eeuo pipefail
          uv run python manage.py makemigrations cart
          uv run ruff format apps/cart/migrations/0001_initial.py
          test -s apps/cart/migrations/0001_initial.py

      - name: Commit generated migration
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -Eeuo pipefail
          git config user.name "sajadkhavas"
          git config user.email "144109918+sajadkhavas@users.noreply.github.com"
          git add apps/cart/migrations/0001_initial.py
          git commit -m "B04: generate cart migration [b04-migration-generated]"
          git push origin HEAD:phase/visio-b04-cart-wishlist-persistence
