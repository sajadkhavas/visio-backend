name: B02 One-Shot Migration Generator

on:
  push:
    branches:
      - phase/visio-b02-catalog-taxonomy-variants-media
    paths:
      - .github/workflows/b02-generate-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_generator
      POSTGRES_USER: visio_generator
      POSTGRES_PASSWORD: visio_generator_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: phase/visio-b02-catalog-taxonomy-variants-media
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"

      - name: Install frozen dependencies
        run: uv sync --frozen --all-groups

      - name: Generate only catalog migration with Django
        run: |
          set -Eeuo pipefail
          uv run python manage.py makemigrations catalog --noinput
          uv run ruff check --fix apps/catalog/migrations
          uv run ruff format apps/catalog/migrations
          uv run ruff check apps/catalog/migrations
          test -f apps/catalog/migrations/0001_initial.py

      - name: Commit deterministic generated migration
        run: |
          set -Eeuo pipefail
          git config user.name "sajadkhavas"
          git config user.email "144109918+sajadkhavas@users.noreply.github.com"
          git add apps/catalog/migrations
          git diff --cached --quiet && { echo "No migration delta generated"; exit 1; }
          git commit -m "chore(b02): generate catalog initial migration"
          git push origin HEAD:phase/visio-b02-catalog-taxonomy-variants-media
