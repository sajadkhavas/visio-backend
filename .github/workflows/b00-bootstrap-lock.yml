name: B00 Bootstrap Lock

on:
  push:
    branches:
      - "phase/visio-b00-python-backend-foundation"
    paths:
      - ".python-version"
      - "pyproject.toml"
      - "config/**"
      - "apps/**"
      - ".github/workflows/b00-bootstrap-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b00-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Resolve lock and generate first user migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: visio_ci
          POSTGRES_USER: visio_ci
          POSTGRES_PASSWORD: visio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visio_ci -d visio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_ci
      POSTGRES_USER: visio_ci
      POSTGRES_PASSWORD: visio_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install pinned uv bootstrap tool
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"

      - name: Resolve and install exact dependency graph
        run: |
          set -Eeuo pipefail
          uv lock
          uv sync --frozen --all-groups

      - name: Generate the first accounts migration with Django
        run: |
          set -Eeuo pipefail
          uv run python manage.py check
          uv run python manage.py makemigrations accounts --noinput
          test -f apps/accounts/migrations/0001_initial.py

      - name: Emit generated bootstrap artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "UV_LOCK_B64_START"
          base64 -w0 uv.lock
          echo
          echo "UV_LOCK_B64_END"
          echo "ACCOUNTS_MIGRATION_B64_START"
          base64 -w0 apps/accounts/migrations/0001_initial.py
          echo
          echo "ACCOUNTS_MIGRATION_B64_END"
