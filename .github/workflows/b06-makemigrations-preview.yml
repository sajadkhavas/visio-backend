name: B06 Django Migration Preview

on:
  push:
    branches:
      - "phase/visio-b06-orders-lifecycle"
    paths:
      - ".github/workflows/b06-makemigrations-preview.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: visio_ci
          POSTGRES_USER: visio_ci
          POSTGRES_PASSWORD: visio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visio_ci -d visio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_ci
      POSTGRES_USER: visio_ci
      POSTGRES_PASSWORD: visio_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.9"
          uv sync --frozen --all-groups
      - name: Generate migration with Django and print exact output
        run: |
          set -Eeuo pipefail
          uv run python manage.py makemigrations orders
          echo '===B06_MIGRATION_BEGIN==='
          cat apps/orders/migrations/0001_initial.py
          echo '===B06_MIGRATION_END==='
