name: B05 Django Migration Generator

on:
  push:
    branches:
      - phase/visio-b05-checkout-shipping-delivery
    paths:
      - "apps/checkout/**"
      - "config/settings/base.py"
      - ".github/workflows/b05-makemigrations.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: visio_migration
      POSTGRES_USER: visio_migration
      POSTGRES_PASSWORD: visio_migration
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: visio_migration
          POSTGRES_USER: visio_migration
          POSTGRES_PASSWORD: visio_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visio_migration -d visio_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: phase/visio-b05-checkout-shipping-delivery
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.9"
          uv sync --frozen --all-groups

      - name: Generate migration with Django
        run: uv run python manage.py makemigrations checkout

      - name: Commit generated migration
        run: |
          set -Eeuo pipefail
          git add apps/checkout/migrations
          if git diff --cached --quiet; then
            echo "No migration delta generated."
            exit 1
          fi
          git config user.name "sajadkhavas"
          git config user.email "144109918+sajadkhavas@users.noreply.github.com"
          git commit -m "B05: generate checkout migration with Django 5.2.17"
          git push origin HEAD:phase/visio-b05-checkout-shipping-delivery
