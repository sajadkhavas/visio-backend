name: I00 Temporary Ruff Formatter

on:
  push:
    branches:
      - phase/visio-i00-backend-contract-gaps
    paths:
      - .github/workflows/i00-ruff-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          check-latest: false
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.9"
      - name: Frozen install
        run: uv sync --frozen --all-groups
      - name: Apply Ruff formatting to exact I00 files
        run: uv run ruff format apps/content/admin.py apps/content/migrations/0002_siteconfiguration_alter_contententry_kind_and_more.py
      - name: Commit mechanical formatting
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/content/admin.py apps/content/migrations/0002_siteconfiguration_alter_contententry_kind_and_more.py
          git diff --cached --check
          git commit -m 'I00: apply mechanical Ruff formatting'
          git push origin HEAD:phase/visio-i00-backend-contract-gaps
