name: R00 Temporary Lock Generator

on:
  push:
    branches:
      - phase/visio-r00-preproduction-rehearsal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r00-lock-generator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: phase/visio-r00-preproduction-rehearsal
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          check-latest: false

      - name: Generate uv lock with pinned uv
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check "uv==0.12.9"
          uv lock
          uv lock --check

      - name: Commit lock only when changed
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- uv.lock; then
            echo "UV_LOCK_CHANGED=0"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(R00): refresh uv lock for Gunicorn"
          git push origin HEAD:phase/visio-r00-preproduction-rehearsal
