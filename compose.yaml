services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: visio
      POSTGRES_USER: visio
      POSTGRES_PASSWORD: visio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visio -d visio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - visio-postgres-data:/var/lib/postgresql/data

volumes:
  visio-postgres-data:
